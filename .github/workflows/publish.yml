# This file is inert inside the monorepo — GitHub only reads workflows from the
# repository root. It becomes active in the Relintio/relintio-cli mirror, where
# it runs the tests and nothing else.
#
# Publishing to npm happens once, from the monorepo:
#   .github/workflows/publish-cli.yml
#
# Do NOT add a publish step here. Two publish jobs racing on the same version
# means one of them fails loudly and neither of you knows which ran. The mirror
# also has no NPM_TOKEN secret, so a publish step here can only ever fail.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # Zero runtime dependencies, so there is nothing to install.
      - name: Run the test suite
        run: npm test

      - name: Smoke test the CLI end to end
        run: |
          node bin/relintio.mjs --version
          node bin/relintio.mjs --help
          mkdir -p /tmp/smoke
          printf '{"dependencies":{"express":"^4.21.2"}}' > /tmp/smoke/package.json
          printf "const express = require('express');\nconst app = express();\napp.listen(3000);\n" > /tmp/smoke/server.js
          node bin/relintio.mjs init \
            --cwd /tmp/smoke \
            --license-key UP_TEST_ci0000000000 \
            --dry-run --yes --no-verify
